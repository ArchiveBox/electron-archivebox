name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-archivebox-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux package and real app screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the release version for this main run
        run: node scripts/release-version.js
      - run: npm run lint
      - run: npm audit --omit=dev
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm imagemagick xdotool
      - name: Build Linux installers
        run: npm run make
      - name: Install Debian package
        run: sudo apt-get install -y ./out/make/deb/x64/*.deb
      - name: Verify Docker daemon
        run: docker info
      - name: Exercise the packaged app through real user actions
        shell: bash
        env:
          ELECTRON_EXECUTABLE: /usr/bin/electron-archivebox
          SCREENSHOT_DIR: artifacts/screenshots/linux
        run: |
          mkdir -p artifacts
          xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run capture-screenshots 2>&1 | tee artifacts/capture.log
      - name: Preserve failed capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-capture-diagnostics
          path: artifacts/
      - name: Stage Linux release downloads
        run: |
          mkdir -p artifacts/releases
          cp out/make/deb/x64/*.deb artifacts/releases/ArchiveBox-Linux.deb
          cp out/make/rpm/x64/*.rpm artifacts/releases/ArchiveBox-Linux.rpm
      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: archivebox-linux-build
          path: artifacts/releases/
          if-no-files-found: error
      - name: Upload verified Linux screenshots
        uses: actions/upload-artifact@v4
        with:
          name: archivebox-screenshots-linux
          path: artifacts/screenshots/linux
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Windows package and first-run screenshots
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the release version for this main run
        run: node scripts/release-version.js
      - run: npm run lint
      - name: Build Windows installer
        run: npm run make
      - name: Install Windows application
        run: |
          $installer = Get-ChildItem out/make -Recurse -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '--silent' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $executable = Join-Path $env:LOCALAPPDATA "archivebox/app-$version/electron-archivebox.exe"
          if (-not (Test-Path $executable)) { throw "Installed app is missing: $executable" }
          Get-Process -Name electron-archivebox -ErrorAction SilentlyContinue | Stop-Process
          "ELECTRON_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise packaged Windows setup and Docker guidance
        env:
          SCREENSHOT_DIR: artifacts/screenshots/windows
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm run capture-screenshots -- --startup-only 2>&1 | Tee-Object artifacts/capture.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve failed capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-capture-diagnostics
          path: artifacts/
      - name: Stage Windows release download
        run: |
          New-Item -ItemType Directory -Force artifacts/releases | Out-Null
          $installer = Get-ChildItem out/make -Recurse -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing' }
          Copy-Item $installer.FullName artifacts/releases/ArchiveBox-Windows.exe
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: archivebox-windows-build
          path: artifacts/releases/
          if-no-files-found: error
      - name: Upload verified Windows screenshots
        uses: actions/upload-artifact@v4
        with:
          name: archivebox-screenshots-windows
          path: artifacts/screenshots/windows
          if-no-files-found: error
          retention-days: 90

  macos:
    name: Mac universal DMG and installed-app screenshots
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the release version for this main run
        run: node scripts/release-version.js
      - run: npm run lint
      - name: Build universal Mac DMG
        run: npm run make -- --arch=universal
      - name: Install the application from its DMG
        shell: bash
        run: |
          image=$(find out/make -name '*.dmg' -print -quit)
          test -n "$image"
          mount="$RUNNER_TEMP/archivebox-dmg"
          destination="$RUNNER_TEMP/Applications/ArchiveBox.app"
          mkdir -p "$mount" "$RUNNER_TEMP/Applications"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          apps=("$mount"/*.app)
          test -d "${apps[0]}"
          test "${#apps[@]}" -eq 1
          ditto "${apps[0]}" "$destination"
          binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$destination/Contents/Info.plist")
          lipo "$destination/Contents/MacOS/$binary" -verify_arch arm64
          lipo "$destination/Contents/MacOS/$binary" -verify_arch x86_64
          echo "ELECTRON_EXECUTABLE=$destination/Contents/MacOS/$binary" >> "$GITHUB_ENV"
      - name: Exercise installed Mac setup and Docker guidance
        env:
          SCREENSHOT_DIR: artifacts/screenshots/macos
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run capture-screenshots -- --startup-only 2>&1 | tee artifacts/capture.log
      - name: Preserve failed capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-capture-diagnostics
          path: artifacts/
      - name: Stage Mac release download
        run: |
          mkdir -p artifacts/releases
          image=$(find out/make -name '*.dmg' -print -quit)
          test -n "$image"
          cp "$image" artifacts/releases/ArchiveBox-Mac.dmg
      - name: Upload Mac installer
        uses: actions/upload-artifact@v4
        with:
          name: archivebox-macos-build
          path: artifacts/releases/
          if-no-files-found: error
      - name: Upload verified Mac screenshots
        uses: actions/upload-artifact@v4
        with:
          name: archivebox-screenshots-macos
          path: artifacts/screenshots/macos
          if-no-files-found: error
          retention-days: 90

  site:
    name: Build public site from verified screenshots
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        with:
          name: archivebox-screenshots-linux
          path: artifacts/screenshots/linux
      - uses: actions/download-artifact@v5
        with:
          name: archivebox-screenshots-windows
          path: artifacts/screenshots/windows
      - uses: actions/download-artifact@v5
        with:
          name: archivebox-screenshots-macos
          path: artifacts/screenshots/macos
      - uses: astral-sh/setup-uv@v7
      - name: Build site and check capture completeness
        run: npm run build-site -- --screenshots-dir artifacts/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: artifacts/screenshots
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish verified desktop installers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [linux, windows, macos, site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve this run's release version
        run: node scripts/release-version.js
      - uses: actions/download-artifact@v5
        with:
          pattern: archivebox-*-build
          path: artifacts/releases
          merge-multiple: true
      - name: Publish versioned release and stable download names
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.js
